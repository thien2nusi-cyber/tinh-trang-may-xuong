<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tình trạng máy tại xưởng</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
  background: #f5f7fa;
  color: #17212b;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

/* ================= HEADER ================= */

header {
  height: 56px;
  background: #17212b;
  color: white;
  display: flex;
  align-items: center;
  padding: 0 18px;
  gap: 12px;
  position: relative;
  z-index: 20;
}

.title {
  font-size: 18px;
  font-weight: 700;
  margin-right: auto;
}

.auth-btn {
  border: 0;
  border-radius: 6px;
  background: #26394b;
  color: white;
  padding: 9px 14px;
  font-weight: 600;
}

.auth-btn:hover {
  background: #314b62;
}

/* ================= STATUS ================= */

#statusbar {
  position: fixed;
  left: 14px;
  top: 66px;
  z-index: 30;
}

.badge {
  display: inline-block;
  padding: 7px 12px;
  border-radius: 8px;
  background: white;
  box-shadow: 0 2px 10px rgba(0,0,0,.12);
  font-size: 13px;
  font-weight: 600;
}

.badge.online {
  color: #16834a;
}

.badge.offline {
  color: #d22;
}

/* ================= CANVAS ================= */

#canvas {
  position: absolute;
  left: 0;
  right: 0;
  top: 56px;
  bottom: 0;
  overflow: hidden;
  background-color: #f8fafc;

  background-image:
    linear-gradient(#dfe5eb 1px, transparent 1px),
    linear-gradient(90deg, #dfe5eb 1px, transparent 1px);

  background-size: 24px 24px;

  cursor: grab;
}

#canvas.dragging {
  cursor: grabbing;
}

#world {
  position: absolute;
  width: 5000px;
  height: 5000px;
  left: 0;
  top: 0;
  transform-origin: 0 0;
}

/* ================= MACHINE ================= */

.machine {
  position: absolute;
  width: 135px;
  min-height: 66px;
  padding: 9px 10px;
  border-radius: 7px;
  box-shadow: 0 3px 8px rgba(0,0,0,.18);
  border: 2px solid rgba(0,0,0,.1);
  user-select: none;
  transition: box-shadow .12s;
}

.machine:hover {
  box-shadow: 0 5px 14px rgba(0,0,0,.25);
}

.machine.selected {
  outline: 3px solid #1976d2;
}

.machine .name {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 5px;
}

.machine .code {
  font-size: 11px;
  opacity: .95;
  margin-bottom: 4px;
}

.machine .status {
  font-size: 11px;
  font-weight: 600;
}

/* ================= LEGEND ================= */

#legend {
  position: fixed;
  right: 16px;
  bottom: 16px;
  background: white;
  border-radius: 10px;
  padding: 12px 14px;
  box-shadow: 0 3px 15px rgba(0,0,0,.15);
  z-index: 15;
  max-width: 620px;
}

.legend-title {
  font-weight: 700;
  margin-bottom: 9px;
}

.legend-items {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
}

.legend-item {
  min-width: 100px;
  padding: 9px 12px;
  border-radius: 8px;
  text-align: center;
  font-size: 12px;
  font-weight: 700;
}

/* ================= ZOOM ================= */

#zoomControls {
  position: fixed;
  left: 16px;
  bottom: 16px;
  z-index: 20;
  background: white;
  box-shadow: 0 3px 12px rgba(0,0,0,.15);
  border-radius: 9px;
  overflow: hidden;
}

#zoomControls button {
  border: 0;
  background: white;
  width: 38px;
  height: 38px;
  font-size: 20px;
}

#zoomControls button:hover {
  background: #eef3f7;
}

/* ================= PANELS ================= */

.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.38);
  z-index: 50;
}

.panel {
  display: none;
  position: fixed;
  z-index: 60;
  background: white;
  width: min(480px, calc(100vw - 30px));
  max-height: calc(100vh - 30px);
  overflow: auto;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  border-radius: 12px;
  box-shadow: 0 15px 50px rgba(0,0,0,.3);
}

.panel-header {
  padding: 16px 18px;
  border-bottom: 1px solid #e4e8ec;
  display: flex;
  align-items: center;
}

.panel-header strong {
  font-size: 18px;
  margin-right: auto;
}

.close-btn {
  border: 0;
  background: transparent;
  font-size: 24px;
  color: #666;
}

.panel-body {
  padding: 18px;
}

.field {
  margin-bottom: 14px;
}

.field label {
  display: block;
  font-weight: 600;
  font-size: 13px;
  margin-bottom: 6px;
}

.field input,
.field select {
  width: 100%;
  padding: 10px 11px;
  border: 1px solid #cbd3da;
  border-radius: 7px;
  outline: none;
}

.field input:focus,
.field select:focus {
  border-color: #1976d2;
}

.actions {
  display: flex;
  gap: 9px;
  margin-top: 18px;
}

.btn {
  border: 0;
  border-radius: 7px;
  padding: 10px 14px;
  font-weight: 700;
}

.btn-primary {
  background: #1976d2;
  color: white;
}

.btn-danger {
  background: #d32f2f;
  color: white;
}

.btn-secondary {
  background: #e8edf2;
  color: #263238;
}

/* ================= LOGIN ================= */

#loginPanel {
  width: min(400px, calc(100vw - 30px));
}

.login-note {
  background: #f2f7fc;
  padding: 10px;
  border-radius: 7px;
  font-size: 13px;
  margin-bottom: 15px;
}

.error {
  color: #d32f2f;
  font-size: 13px;
  margin-top: 8px;
}

/* ================= HISTORY ================= */

.history-item {
  padding: 11px 0;
  border-bottom: 1px solid #e6e9ed;
}

.history-time {
  color: #777;
  font-size: 11px;
  margin-bottom: 4px;
}

.history-text {
  font-size: 13px;
}

/* ================= VIEWER GATE ================= */

#viewerGate {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(0,0,0,.45);
  align-items: center;
  justify-content: center;
}

.viewer-box {
  width: min(380px, calc(100vw - 30px));
  background: white;
  border-radius: 12px;
  padding: 22px;
  box-shadow: 0 20px 60px rgba(0,0,0,.3);
}

.viewer-box h3 {
  margin-top: 0;
}

/* ================= RESPONSIVE ================= */

@media (max-width: 700px) {
  .title {
    font-size: 15px;
  }

  #legend {
    right: 10px;
    bottom: 10px;
    left: 70px;
  }

  .legend-item {
    min-width: 80px;
  }
}
</style>
</head>

<body>

<header>
  <div class="title">🏭 Tình trạng máy tại xưởng</div>

  <button id="addBtn" class="auth-btn" style="display:none">
    ＋ Thêm máy
  </button>

  <button id="historyBtn" class="auth-btn" style="display:none">
    📋 Lịch sử
  </button>

  <button id="authBtn" class="auth-btn">
    🔐 Đăng nhập Admin
  </button>
</header>

<div id="statusbar">
  <span class="badge offline">Đang tải...</span>
</div>

<div id="canvas">
  <div id="world"></div>
</div>

<div id="zoomControls">
  <button id="zoomIn">+</button>
  <button id="zoomOut">−</button>
  <button id="zoomReset">⌂</button>
</div>

<div id="legend"></div>

<!-- ================= OVERLAY ================= -->

<div id="overlay" class="overlay"></div>

<!-- ================= LOGIN ================= -->

<div id="loginPanel" class="panel">

  <div class="panel-header">
    <strong>Đăng nhập Admin</strong>
    <button class="close-btn" onclick="closeAuth()">×</button>
  </div>

  <div class="panel-body">

    <div class="login-note">
      Chỉ tài khoản có role <b>admin</b> trong bảng
      <b>profiles</b> mới có quyền chỉnh sửa.
    </div>

    <div class="field">
      <label>Email</label>
      <input id="loginEmail" type="email" placeholder="admin@example.com">
    </div>

    <div class="field">
      <label>Mật khẩu</label>
      <input id="loginPassword" type="password" placeholder="••••••••">
    </div>

    <div id="loginError" class="error"></div>

    <div class="actions">
      <button class="btn btn-primary" onclick="login()">
        Đăng nhập
      </button>

      <button class="btn btn-secondary" onclick="closeAuth()">
        Hủy
      </button>
    </div>

  </div>
</div>

<!-- ================= MACHINE PANEL ================= -->

<div id="machinePanel" class="panel">

  <div class="panel-header">
    <strong id="machinePanelTitle">Máy</strong>
    <button class="close-btn" onclick="closeMachinePanel()">×</button>
  </div>

  <div class="panel-body">

    <div class="field">
      <label>Tên máy</label>
      <input id="machineName">
    </div>

    <div class="field">
      <label>Mã máy</label>
      <input id="machineCode">
    </div>

    <div class="field">
      <label>Trạng thái</label>
      <select id="machineStatus"></select>
    </div>

    <div class="field">
      <label>Tọa độ X</label>
      <input id="machineX" type="number">
    </div>

    <div class="field">
      <label>Tọa độ Y</label>
      <input id="machineY" type="number">
    </div>

    <div id="machineError" class="error"></div>

    <div class="actions">
      <button class="btn btn-primary" onclick="saveMachine()">
        Lưu
      </button>

      <button
        id="deleteMachineBtn"
        class="btn btn-danger"
        onclick="deleteMachine()">
        Xóa
      </button>

      <button class="btn btn-secondary" onclick="closeMachinePanel()">
        Hủy
      </button>
    </div>

  </div>
</div>

<!-- ================= HISTORY ================= -->

<div id="historyPanel" class="panel">

  <div class="panel-header">
    <strong>Lịch sử thay đổi</strong>
    <button class="close-btn" onclick="closeHistory()">×</button>
  </div>

  <div id="historyContent" class="panel-body"></div>

</div>

<!-- ================= VIEWER GATE ================= -->

<div id="viewerGate">

  <div class="viewer-box">

    <h3>🔐 Mã xem</h3>

    <p>
      Nhập mã để mở giao diện xem trạng thái máy.
    </p>

    <div class="field">
      <input
        id="viewerCode"
        type="password"
        placeholder="Nhập mã">
    </div>

    <div id="viewerError" class="error"></div>

    <div class="actions">
      <button class="btn btn-primary" onclick="unlockViewer()">
        Xác nhận
      </button>
    </div>

  </div>

</div>

<script>

/* =========================================================
   1. SUPABASE CONFIG
   ========================================================= */

/*
   QUAN TRỌNG:

   SUPABASE_URL:
   https://maemqzfpsxczklixxaic.supabase.co

   SUPABASE_KEY:
   Dùng PUBLISHABLE KEY:
   sb_publishable_...

   KHÔNG dùng:
   sb_secret_...
*/

const SUPABASE_URL =
  'https://maemqzfpsxczklixxaic.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_AfYltiueRPDKEicNVBTaiA__guFg0o_';


/* =========================================================
   2. SUPABASE CLIENT
   ========================================================= */

const configured =
  SUPABASE_URL.startsWith('https://') &&
  !SUPABASE_URL.includes('YOUR_') &&
  SUPABASE_KEY.startsWith('sb_') &&
  !SUPABASE_KEY.includes('YOUR_');

const sb = configured
  ? window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    )
  : null;


/* =========================================================
   3. GLOBAL STATE
   ========================================================= */

let machines = [];
let statuses = [];
let history = [];
let selected = null;

let currentUser = null;
let currentRole = null;

let scale = 1;
let panX = 0;
let panY = 0;

let drag = null;
let pan = null;

/*
  QUAN TRỌNG:

  Chỉ được có MỘT realtime channel.

  Đây là phần sửa lỗi:

  "cannot add postgres_changes callbacks
   for realtime:machine-board after subscribe()"
*/

let realtimeChannel = null;


/* =========================================================
   4. DOM
   ========================================================= */

const canvas = document.getElementById('canvas');
const world = document.getElementById('world');


/* =========================================================
   5. HELPERS
   ========================================================= */

function esc(value) {

  return String(value ?? '')
    .replace(/[&<>"']/g, char => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    })[char]);

}


function canEdit() {

  return !!currentUser &&
         currentRole === 'admin';

}


function setStatus(text, kind = 'online') {

  const e = document.getElementById('statusbar');

  e.innerHTML =
    `<span class="badge ${kind}">
      ${esc(text)}
    </span>`;

}


function closeAllPanels() {

  document.getElementById('machinePanel').style.display = 'none';
  document.getElementById('historyPanel').style.display = 'none';

  document.getElementById('overlay').style.display = 'none';

}


/* =========================================================
   6. VIEW TRANSFORM
   ========================================================= */

function updateWorldTransform() {

  world.style.transform =
    `translate(${panX}px, ${panY}px) scale(${scale})`;

}


function resetView() {

  scale = 1;
  panX = 0;
  panY = 0;

  updateWorldTransform();

}


function zoomAt(factor, clientX, clientY) {

  const rect = canvas.getBoundingClientRect();

  const mx =
    (clientX - rect.left - panX) / scale;

  const my =
    (clientY - rect.top - panY) / scale;

  const newScale =
    Math.max(.35, Math.min(2.5, scale * factor));

  panX =
    clientX - rect.left - mx * newScale;

  panY =
    clientY - rect.top - my * newScale;

  scale = newScale;

  updateWorldTransform();

}


/* =========================================================
   7. RENDER
   ========================================================= */

function render() {

  world.innerHTML = '';

  machines.forEach(machine => {

    const status =
      statuses.find(
        s => s.id === machine.status_id
      ) || statuses[0];

    if (!status) return;

    const d =
      document.createElement('div');

    d.className = 'machine';

    d.dataset.id = machine.id;

    d.style.left =
      `${Number(machine.x) || 0}px`;

    d.style.top =
      `${Number(machine.y) || 0}px`;

    d.style.background =
      status.bg_color || '#22c55e';

    d.style.color =
      status.text_color || '#ffffff';

    d.innerHTML = `
      <div class="name">
        ${esc(machine.name)}
      </div>

      <div class="code">
        ${esc(machine.code || '')}
      </div>

      <div class="status">
        ${esc(status.name)}
      </div>
    `;

    /*
      Chỉ admin mới được kéo máy.
    */

    d.onmousedown = event => {

      if (!canEdit()) return;

      startMachineDrag(event, machine);

    };


    d.ondblclick = event => {

      event.stopPropagation();

      if (!canEdit()) return;

      openMachinePanel(machine.id);

    };


    world.appendChild(d);

  });


  renderLegend();

  updateWorldTransform();

}


/* =========================================================
   8. LEGEND
   ========================================================= */

function renderLegend() {

  const legend =
    document.getElementById('legend');

  legend.innerHTML = `
    <div class="legend-title">
      Chú thích trạng thái máy
    </div>

    <div class="legend-items">

      ${statuses.map(status => `

        <div
          class="legend-item"
          style="
            background:${esc(status.bg_color || '#22c55e')};
            color:${esc(status.text_color || '#fff')};
          "
        >
          ${esc(status.name)}
        </div>

      `).join('')}

    </div>
  `;

}


/* =========================================================
   9. LOAD PROFILE
   ========================================================= */

async function loadProfile() {

  currentRole = null;

  if (!currentUser) {
    return;
  }

  const {
    data,
    error
  } = await sb
    .from('profiles')
    .select('role')
    .eq('id', currentUser.id)
    .maybeSingle();

  if (error) {

    console.error(
      'loadProfile:',
      error
    );

    return;

  }

  currentRole =
    data?.role || 'viewer';

}


/* =========================================================
   10. LOAD STATUSES
   ========================================================= */

async function loadStatuses() {

  const {
    data,
    error
  } = await sb
    .from('statuses')
    .select('*')
    .order('id');

  if (error) {

    console.error(
      'loadStatuses:',
      error
    );

    setStatus(
      'Lỗi tải trạng thái',
      'offline'
    );

    return;

  }

  statuses = data || [];

}


/* =========================================================
   11. LOAD MACHINES
   ========================================================= */

async function loadMachines() {

  const {
    data,
    error
  } = await sb
    .from('machines')
    .select('*')
    .order('id');

  if (error) {

    console.error(
      'loadMachines:',
      error
    );

    setStatus(
      'Lỗi tải máy',
      'offline'
    );

    return;

  }

  machines = data || [];

}


/* =========================================================
   12. LOAD HISTORY
   ========================================================= */

async function loadHistory() {

  const {
    data,
    error
  } = await sb
    .from('change_history')
    .select('*')
    .order(
      'created_at',
      {
        ascending: false
      }
    )
    .limit(500);

  if (error) {

    console.warn(
      'Không tải được history:',
      error.message
    );

    history = [];

    return;

  }

  history = data || [];

}


/* =========================================================
   13. REALTIME
   ========================================================= */

function subscribeRealtime() {

  if (!sb) return;


  /*
    Nếu channel cũ còn tồn tại:

    KHÔNG tạo channel mới.

    Đây chính là chỗ sửa lỗi của mày.
  */

  if (realtimeChannel) {

    console.log(
      'Realtime đã tồn tại, không subscribe lại.'
    );

    return;

  }


  realtimeChannel =
    sb
      .channel('machine-board')

      .on(
        'postgres_changes',
        {
          event: '*',
          schema: 'public',
          table: 'machines'
        },
        async () => {

          await loadMachines();

          render();

        }
      )

      .on(
        'postgres_changes',
        {
          event: '*',
          schema: 'public',
          table: 'statuses'
        },
        async () => {

          await loadStatuses();

          render();

        }
      )

      .on(
        'postgres_changes',
        {
          event: '*',
          schema: 'public',
          table: 'change_history'
        },
        async () => {

          await loadHistory();

          if (
            document.getElementById(
              'historyPanel'
            ).style.display === 'block'
          ) {

            renderHistory();

          }

        }
      )

      .subscribe(
        status => {

          console.log(
            'Realtime status:',
            status
          );

          if (status === 'SUBSCRIBED') {

            console.log(
              'Realtime connected.'
            );

          }

          if (
            status === 'CHANNEL_ERROR' ||
            status === 'TIMED_OUT'
          ) {

            console.warn(
              'Realtime error:',
              status
            );

          }

        }
      );

}


/* =========================================================
   14. STOP REALTIME
   ========================================================= */

async function stopRealtime() {

  if (!realtimeChannel || !sb) {
    return;
  }

  await sb.removeChannel(
    realtimeChannel
  );

  realtimeChannel = null;

}


/* =========================================================
   15. AUTH UI
   ========================================================= */

function updateAuthUI() {

  const auth =
    document.getElementById('authBtn');

  const isAdmin =
    canEdit();


  auth.textContent =
    isAdmin
      ? '👑 Admin • Đăng xuất'
      : '🔐 Đăng nhập Admin';


  const adminButtons = [
    'addBtn',
    'historyBtn'
  ];

  adminButtons.forEach(id => {

    const e =
      document.getElementById(id);

    if (e) {

      e.style.display =
        isAdmin
          ? 'inline-block'
          : 'none';

    }

  });

}


/* =========================================================
   16. LOAD ALL
   ========================================================= */

async function loadAll() {

  if (!configured) {

    setStatus(
      'Chưa cấu hình Supabase',
      'offline'
    );

    openAuth();

    document.getElementById(
      'loginError'
    ).textContent =
      'Hãy điền SUPABASE_URL và SUPABASE_KEY ở đầu file.';

    return;

  }


  try {

    const {
      data: {
        session
      }
    } =
      await sb.auth.getSession();


    currentUser =
      session?.user || null;


    await loadProfile();


    await Promise.all([
      loadStatuses(),
      loadMachines(),
      loadHistory()
    ]);


    updateAuthUI();

    render();

    /*
      QUAN TRỌNG:
      subscribeRealtime() chỉ tạo channel
      nếu chưa có channel.
    */

    subscribeRealtime();


    if (currentUser) {

      setStatus(
        canEdit()
          ? '👑 Admin — realtime'
          : 'Chỉ xem — realtime',
        'online'
      );

    } else {

      setStatus(
        'Chỉ xem — realtime',
        'online'
      );

    }

  } catch (error) {

    console.error(
      'loadAll:',
      error
    );

    setStatus(
      'Lỗi kết nối Supabase',
      'offline'
    );

  }

}


/* =========================================================
   17. LOGIN
   ========================================================= */

async function login() {

  if (!sb) {

    document.getElementById(
      'loginError'
    ).textContent =
      'Supabase chưa được cấu hình.';

    return;

  }


  const email =
    document
      .getElementById('loginEmail')
      .value
      .trim();


  const password =
    document
      .getElementById('loginPassword')
      .value;


  const errorBox =
    document.getElementById(
      'loginError'
    );


  errorBox.textContent = '';


  if (!email || !password) {

    errorBox.textContent =
      'Nhập email và mật khẩu.';

    return;

  }


  const {
    error
  } =
    await sb.auth.signInWithPassword({
      email,
      password
    });


  if (error) {

    errorBox.textContent =
      error.message;

    return;

  }


  closeAuth();

  /*
    Không gọi subscribeRealtime trực tiếp ở đây.
    loadAll sẽ lo toàn bộ.
  */

  await loadAll();

}


/* =========================================================
   18. LOGOUT
   ========================================================= */

async function logout() {

  if (!sb) return;

  await sb.auth.signOut();

}


/* =========================================================
   19. AUTH BUTTON
   ========================================================= */

document
  .getElementById('authBtn')
  .onclick = async () => {

    if (currentUser) {

      await logout();

    } else {

      openAuth();

    }

  };


/* =========================================================
   20. AUTH STATE
   ========================================================= */

if (sb) {

  sb.auth.onAuthStateChange(
    async (event, session) => {

      console.log(
        'Auth event:',
        event
      );


      currentUser =
        session?.user || null;


      if (event === 'SIGNED_OUT') {

        currentRole = null;

        updateAuthUI();

        setStatus(
          'Đã đăng xuất — chỉ xem',
          'online'
        );

        return;

      }


      if (
        event === 'SIGNED_IN' ||
        event === 'TOKEN_REFRESHED'
      ) {

        /*
          Không subscribe thêm channel.
          loadAll tự kiểm tra.
        */

        currentUser =
          session?.user || null;

        await loadProfile();

        updateAuthUI();

        render();

        setStatus(
          canEdit()
            ? '👑 Admin — realtime'
            : 'Chỉ xem — realtime',
          'online'
        );

      }

    }
  );

}


/* =========================================================
   21. OPEN LOGIN
   ========================================================= */

function openAuth() {

  document.getElementById(
    'loginPanel'
  ).style.display = 'block';

  document.getElementById(
    'overlay'
  ).style.display = 'block';

  setTimeout(() => {

}


function closeAuth() {

    'loginPanel'
  ).style.display = 'none';

    'overlay'
  ).style.display = 'none';

/* =========================================================
   22. MACHINE PANEL
   ========================================================= */

function openMachinePanel(id = null) {

  if (!canEdit()) {

    return;

  }


  selected =
    id
      ? machines.find(
          m => String(m.id) === String(id)
        )
      : null;


  document.getElementById(
    'machinePanelTitle'
  ).textContent =
    selected
      ? 'Sửa máy'
      : 'Thêm máy';


  document.getElementById(
    'machineName'
  ).value =
    selected?.name || '';


  document.getElementById(
    'machineCode'
  ).value =
    selected?.code || '';


  document.getElementById(
    'machineX'
  ).value =
    selected?.x ?? 100;


  document.getElementById(
    'machineY'
  ).value =
    selected?.y ?? 100;


  const statusSelect =
    document.getElementById(
      'machineStatus'
    );


  statusSelect.innerHTML =
    statuses
      .map(status => `
        <option
          value="${esc(status.id)}"
          ${selected &&
            String(selected.status_id) ===
            String(status.id)
            ? 'selected'
            : ''}
        >
          ${esc(status.name)}
        </option>
      `)
      .join('');


  document.getElementById(
    'machineError'
  ).textContent = '';


  document.getElementById(
    'deleteMachineBtn'
  ).style.display =
    selected
      ? 'inline-block'
      : 'none';


  document.getElementById(
    'machinePanel'
  ).style.display = 'block';


  document.getElementById(
    'overlay'
  ).style.display = 'block';

}


function closeMachinePanel() {

  document.getElementById(
    'machinePanel'
  ).style.display = 'none';

  document.getElementById(
    'overlay'
  ).style.display = 'none';

  selected = null;

}


/* =========================================================
   23. SAVE MACHINE
   ========================================================= */

async function saveMachine() {

  if (!canEdit()) {

    alert('Bạn không có quyền chỉnh sửa.');

    return;

  }


  const errorBox =
    document.getElementById(
      'machineError'
    );


  errorBox.textContent = '';


  const name =
    document
      .getElementById('machineName')
      .value
      .trim();


  const code =
    document
      .getElementById('machineCode')
      .value
      .trim();


  const status_id =
    document.getElementById(
      'machineStatus'
    ).value;


  const x =
    Number(
      document.getElementById(
        'machineX'
      ).value
    );


  const y =
    Number(
      document.getElementById(
        'machineY'
      ).value
    );


  if (!name) {

    errorBox.textContent =
      'Nhập tên máy.';

    return;

  }


  const payload = {
    name,
    code,
    status_id,
    x,
    y
  };


  let result;


  if (selected) {

    result =
      await sb
        .from('machines')
        .update(payload)
        .eq('id', selected.id);

  } else {

    result =
      await sb
        .from('machines')
        .insert(payload);

  }


  if (result.error) {

    console.error(
      result.error
    );

    errorBox.textContent =
      result.error.message;

    return;

  }


  closeMachinePanel();

  await loadMachines();

  render();

}


/* =========================================================
   24. DELETE MACHINE
   ========================================================= */

async function deleteMachine() {

  if (!canEdit() || !selected) {
    return;
  }


  if (
    !confirm(
      `Xóa máy "${selected.name}"?`
    )
  ) {

    return;

  }


  const {
    error
  } =
    await sb
      .from('machines')
      .delete()
      .eq('id', selected.id);


  if (error) {

    alert(error.message);

    return;

  }


  closeMachinePanel();

  await loadMachines();

  render();

}


/* =========================================================
   25. DRAG MACHINE
   ========================================================= */

function startMachineDrag(event, machine) {

  if (!canEdit()) {
    return;
  }


  event.stopPropagation();


  const startX =
    event.clientX;

  const startY =
    event.clientY;


  const originalX =
    Number(machine.x) || 0;

  const originalY =
    Number(machine.y) || 0;


  drag = {
    machine,
    startX,
    startY,
    originalX,
    originalY
  };


  window.addEventListener(
    'mousemove',
    moveMachineDrag
  );


  window.addEventListener(
    'mouseup',
    endMachineDrag
  );

}


function moveMachineDrag(event) {

  if (!drag) return;


  const dx =
    (event.clientX - drag.startX) /
    scale;


  const dy =
    (event.clientY - drag.startY) /
    scale;


  drag.machine.x =
    drag.originalX + dx;


  drag.machine.y =
    drag.originalY + dy;


  const element =
    document.querySelector(
      `.machine[data-id="${drag.machine.id}"]`
    );


  if (element) {

    element.style.left =
      `${drag.machine.x}px`;

    element.style.top =
      `${drag.machine.y}px`;

  }

}


async function endMachineDrag() {

  if (!drag) return;


  const machine =
    drag.machine;


  drag = null;


  window.removeEventListener(
    'mousemove',
    moveMachineDrag
  );


  window.removeEventListener(
    'mouseup',
    endMachineDrag
  );


  if (!canEdit()) {
    return;
  }


  const {
    error
  } =
    await sb
      .from('machines')
      .update({
        x: machine.x,
        y: machine.y
      })
      .eq('id', machine.id);


  if (error) {

    console.error(
      'Lỗi lưu vị trí:',
      error
    );

    await loadMachines();

    render();

  }

}


/* =========================================================
   26. DRAG CANVAS
   ========================================================= */

canvas.addEventListener(
  'mousedown',
  event => {

    if (
      event.target !== canvas &&
      event.target !== world
    ) {

      return;

    }


    pan = {
      startX: event.clientX,
      startY: event.clientY,
      originalX: panX,
      originalY: panY
    };


    canvas.classList.add(
      'dragging'
    );

  }
);


window.addEventListener(
  'mousemove',
  event => {

    if (!pan) return;


    panX =
      pan.originalX +
      event.clientX -
      pan.startX;


    panY =
      pan.originalY +
      event.clientY -
      pan.startY;


    updateWorldTransform();

  }
);


window.addEventListener(
  'mouseup',
  () => {

    pan = null;

    canvas.classList.remove(
      'dragging'
    );

  }
);


/* =========================================================
   27. WHEEL ZOOM
   ========================================================= */

canvas.addEventListener(
  'wheel',
  event => {

    event.preventDefault();

    zoomAt(
      event.deltaY < 0
        ? 1.1
        : 0.9,
      event.clientX,
      event.clientY
    );

  },
  {
    passive: false
  }
);


/* =========================================================
   28. ZOOM BUTTONS
   ========================================================= */

document
  .getElementById('zoomIn')
  .onclick = () => {

    const rect =
      canvas.getBoundingClientRect();

    zoomAt(
      1.15,
      rect.left + rect.width / 2,
      rect.top + rect.height / 2
    );

  };


document
  .getElementById('zoomOut')
  .onclick = () => {

    const rect =
      canvas.getBoundingClientRect();

    zoomAt(
      0.87,
      rect.left + rect.width / 2,
      rect.top + rect.height / 2
    );

  };


document
  .getElementById('zoomReset')
  .onclick =
    resetView;


/* =========================================================
   29. ADD BUTTON
   ========================================================= */

document
  .getElementById('addBtn')
  .onclick =
    () => openMachinePanel();


/* =========================================================
   30. HISTORY
   ========================================================= */

function openHistory() {

  if (!canEdit()) {
    return;
  }


  renderHistory();


  document.getElementById(
    'historyPanel'
  ).style.display = 'block';


  document.getElementById(
    'overlay'
  ).style.display = 'block';

}


function closeHistory() {

  document.getElementById(
    'historyPanel'
  ).style.display = 'none';


  document.getElementById(
    'overlay'
  ).style.display = 'none';

}


function renderHistory() {

  const box =
    document.getElementById(
      'historyContent'
    );


  if (!history.length) {

    box.innerHTML =
      '<div>Chưa có lịch sử.</div>';

    return;

  }


  box.innerHTML =
    history
      .map(item => {

        const date =
          item.created_at
            ? new Date(
                item.created_at
              ).toLocaleString('vi-VN')
            : '';


        /*
          Hỗ trợ nhiều kiểu cột
          tùy bảng change_history của mày.
        */

        const text =
          item.description ||
          item.action ||
          item.message ||
          JSON.stringify(item);


        return `
          <div class="history-item">

            <div class="history-time">
              ${esc(date)}
            </div>

            <div class="history-text">
              ${esc(text)}
            </div>

          </div>
        `;

      })
      .join('');

}


document
  .getElementById('historyBtn')
  .onclick =
    openHistory;


/* =========================================================
   31. OVERLAY CLICK
   ========================================================= */

document
  .getElementById('overlay')
  .onclick = () => {

    closeAllPanels();

  };


/* =========================================================
   32. ESC KEY
   ========================================================= */

document.addEventListener(
  'keydown',
  event => {

    if (event.key === 'Escape') {

      closeAllPanels();

    }

  }
);


/* =========================================================
   33. START
   ========================================================= */

(async function startApp() {

  updateWorldTransform();

  await loadAll();

})();
